<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aapka Jawaab?</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #121214;
      color: #fff;
      transition: background 0.8s cubic-bezier(0.25, 1, 0.5, 1);
      overflow: hidden;
      position: relative;
      padding: 20px;
    }
    .card {
      max-width: 400px;
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 30px;
      padding: 40px 24px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
      transition: all 0.8s cubic-bezier(0.25, 1, 0.5, 1);
      text-align: center;
      z-index: 10;
      transform: scale(1);
    }
    .emoji-box {
      position: relative;
      height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
    }
    .emoji {
      font-size: 80px;
      filter: drop-shadow(0 10px 15px rgba(0,0,0,0.3));
      animation: float 3s ease-in-out infinite;
      transition: all 0.5s ease;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(3deg); }
    }
    h2 {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 30px;
      line-height: 1.4;
      text-shadow: 0 2px 10px rgba(0,0,0,0.3);
      transition: all 0.5s ease;
    }
    .btn-group {
      display: flex;
      gap: 16px;
      justify-content: center;
    }
    button {
      flex: 1;
      padding: 15px 24px;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      position: relative;
      overflow: hidden;
    }
    button:active {
      transform: scale(0.92);
    }
    .btn-yes {
      background: linear-gradient(45deg, #ff3366, #ff5e62);
      color: #fff;
      box-shadow: 0 8px 25px rgba(255, 51, 102, 0.4);
    }
    .btn-yes:hover {
      box-shadow: 0 12px 30px rgba(255, 51, 102, 0.6);
      transform: translateY(-2px);
    }
    .btn-no {
      background: #3a3a44;
      color: #b5b5c3;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
    }
    .btn-no:hover {
      background: #2f2f38;
      color: #fff;
      transform: translateY(-2px);
    }

    /* Falling Particles Effect */
    .particle {
      position: absolute;
      pointer-events: none;
      animation: fall linear forwards;
      z-index: 1;
    }
    @keyframes fall {
      0% {
        transform: translateY(-50px) rotate(0deg) scale(0);
        opacity: 0;
      }
      10% {
        opacity: 0.8;
      }
      90% {
        opacity: 0.8;
      }
      100% {
        transform: translateY(105vh) rotate(360deg) scale(1.2);
        opacity: 0;
      }
    }

    /* --- YES / LOVE THEME --- */
    body.love-theme {
      background: radial-gradient(circle at center, #ff416c 0%, #ff4b2b 100%);
    }
    body.love-theme .card {
      background: rgba(255, 255, 255, 0.18);
      border-color: rgba(255, 255, 255, 0.3);
      box-shadow: 0 30px 70px rgba(255, 20, 147, 0.4);
      transform: scale(1.03);
    }
    body.love-theme h2 {
      color: #fff;
      text-shadow: 0 0 15px rgba(255, 255, 255, 0.6), 0 0 30px rgba(255, 20, 147, 0.8);
    }

    /* --- NO / SAD THEME --- */
    body.sad-theme {
      background: radial-gradient(circle at center, #1f252e 0%, #090a0f 100%);
    }
    body.sad-theme .card {
      background: rgba(0, 0, 0, 0.5);
      border-color: rgba(255, 255, 255, 0.05);
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.9);
      transform: scale(0.95);
    }
    body.sad-theme h2 {
      color: #8a8a9a;
      text-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
    }
    body.sad-theme .emoji {
      animation: shudder 0.5s ease infinite;
    }
    @keyframes shudder {
      0%, 100% { transform: translate(0, 0) rotate(0); }
      20% { transform: translate(-2px, 1px) rotate(-1deg); }
      40% { transform: translate(1px, -1px) rotate(1deg); }
      60% { transform: translate(-1px, 2px) rotate(0deg); }
      80% { transform: translate(2px, 1px) rotate(1deg); }
    }
  </style>
</head>
<body>

  <div class="card" id="mainCard">
    <div class="emoji-box">
      <div class="emoji" id="emoji">✨🤔</div>
    </div>
    <h2 id="text">Kya aap mere saath chalenge?</h2>
    <div class="btn-group" id="btnContainer">
      <button class="btn-yes" onclick="handleYes()">Yes</button>
      <button class="btn-no" onclick="handleNo()">No</button>
    </div>
  </div>

  <script>
    function createParticles(types) {
      const particleCount = 45;
      for (let i = 0; i < particleCount; i++) {
        setTimeout(() => {
          const particle = document.createElement('div');
          particle.className = 'particle';
          particle.innerText = types[Math.floor(Math.random() * types.length)];
          particle.style.left = Math.random() * 100 + 'vw';
          particle.style.fontSize = Math.random() * 20 + 20 + 'px';
          
          const duration = Math.random() * 3 + 3;
          particle.style.animationDuration = duration + 's';
          particle.style.animationDelay = Math.random() * 2 + 's';
          
          document.body.appendChild(particle);
          
          setTimeout(() => {
            particle.remove();
          }, (duration + 2) * 1000);
        }, i * 100);
      }
    }

    function handleYes() {
      document.body.className = 'love-theme';
      document.getElementById('emoji').innerText = '🥰💖🎉';
      document.getElementById('text').innerText = 'Yayyy! Dil khush kar diya toone love u meri jaan P
       ! ❤️✨🤩';
      document.getElementById('btnContainer').innerHTML = `
        <button class="btn-yes" onclick="location.reload()" style="background: rgba(255,255,255,0.25); backdrop-filter: blur(5px); box-shadow: none; border: 1px solid rgba(255,255,255,0.4);">
          ✨ Doobara dekhein ✨
        </button>
      `;
      createParticles(['❤️', '💖', '💝', '🥰', '✨', '🔥', '🌸', '😘', '🎈']);
    }

    function handleNo() {
      document.body.className = 'sad-theme';
      document.getElementById('emoji').innerText = '🥺💔⛈️';
      document.getElementById('text').innerText = 'bye bye for ever priya 😭\nSAB KHTM 💔🥀';
      document.getElementById('btnContainer').innerHTML = `
        <button class="btn-no" onclick="location.reload()" style="background: #24252a; color: #737888; border: 1px solid rgba(255,255,255,0.05);">
          🔄 Ek mauka aur do?
        </button>
      `;
      createParticles(['🌧️', '💧', '😭', '💔', '🥀', '☔', '🚶‍♂️', '💭', '📉']);
    }
  </script>

</body>
</html>
