<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Aapka Jawaab?</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #121214;
      color: #fff;
      transition: background 0.6s ease;
      overflow: hidden;
      position: relative;
      padding: 20px;
    }
    .card {
      max-width: 380px;
      width: 100%;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 28px;
      padding: 36px 20px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
      text-align: center;
      position: relative;
      z-index: 100;
      transition: all 0.5s ease;
    }
    .emoji-box {
      height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 15px;
    }
    .emoji {
      font-size: 70px;
      line-height: 1;
      animation: float 3s ease-in-out infinite;
      user-select: none;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    h2 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 25px;
      line-height: 1.4;
      white-space: pre-line;
      user-select: none;
    }
    .btn-group {
      display: flex;
      gap: 14px;
      justify-content: center;
      position: relative;
      z-index: 200;
    }
    button {
      flex: 1;
      padding: 14px 20px;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      touch-action: manipulation;
      transition: transform 0.15s ease, background 0.3s ease;
      position: relative;
      z-index: 300;
    }
    button:active {
      transform: scale(0.92);
    }
    .btn-yes {
      background: linear-gradient(45deg, #ff3366, #ff5e62);
      color: #fff;
      box-shadow: 0 6px 20px rgba(255, 51, 102, 0.4);
    }
    .btn-no {
      background: #32323a;
      color: #e0e0e0;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
    }

    /* Falling Particles */
    .particle {
      position: absolute;
      pointer-events: none;
      user-select: none;
      animation: fall linear forwards;
      z-index: 10;
    }
    @keyframes fall {
      0% {
        transform: translateY(-50px) rotate(0deg);
        opacity: 0;
      }
      10% {
        opacity: 0.9;
      }
      90% {
        opacity: 0.9;
      }
      100% {
        transform: translateY(105vh) rotate(360deg);
        opacity: 0;
      }
    }

    /* Themes */
    body.love-theme {
      background: radial-gradient(circle at center, #ff416c 0%, #ff4b2b 100%);
    }
    body.sad-theme {
      background: radial-gradient(circle at center, #1b2028 0%, #08090c 100%);
    }
    body.sad-theme h2 {
      color: #a0a5b5;
    }
  </style>
</head>
<body>

  <div class="card" id="mainCard">
    <div class="emoji-box">
      <div class="emoji" id="emoji">✨🤔</div>
    </div>
    <h2 id="text">RELATIONSHIP DECIDED OPTION H SOCH SMJH KR JAWAAB DIYO ?</h2>
    <div class="btn-group" id="btnContainer">
      <button type="button" class="btn-yes" id="yesBtn">Yes</button>
      <button type="button" class="btn-no" id="noBtn">No</button>
    </div>
  </div>

  <script>
    const yesBtn = document.getElementById('yesBtn');
    const noBtn = document.getElementById('noBtn');

    function createParticles(types) {
      for (let i = 0; i < 40; i++) {
        setTimeout(() => {
          const p = document.createElement('div');
          p.className = 'particle';
          p.innerText = types[Math.floor(Math.random() * types.length)];
          p.style.left = Math.random() * 95 + 'vw';
          p.style.fontSize = Math.random() * 18 + 22 + 'px';
          const duration = Math.random() * 2.5 + 3;
          p.style.animationDuration = duration + 's';
          document.body.appendChild(p);
          setTimeout(() => p.remove(), (duration + 1) * 1000);
        }, i * 90);
      }
    }

    function handleYesAction(e) {
      if (e) e.preventDefault();
      document.body.className = 'love-theme';
      document.getElementById('emoji').innerText = '🥰💖🎉';
      document.getElementById('text').innerText = 'Yayyy! Dil khush kar diya toone love u my love! ❤️✨🤩';
      document.getElementById('btnContainer').innerHTML = `
        <button type="button" class="btn-yes" onclick="window.location.reload()" style="background: rgba(255,255,255,0.25); border: 1px solid rgba(255,255,255,0.4);">
          ✨ Dobara dekhein ✨
        </button>
      `;
      createParticles(['❤️', '💖', '💝', '🥰', '✨', '🔥', '🌸', '🎈']);
    }

    function handleNoAction(e) {
      if (e) e.preventDefault();
      document.body.className = 'sad-theme';
      document.getElementById('emoji').innerText = '🥺💔⛈️';
      document.getElementById('text').innerText = 'bye bye for ever priya \nSAB KHTM H IS BAAR AB 💔🥀';
      document.getElementById('btnContainer').innerHTML = `
        <button type="button" class="btn-no" onclick="window.location.reload()" style="background: #24252a; border: 1px solid rgba(255,255,255,0.1);">
          🔄 Ek mauka aur ?
        </button>
      `;
      createParticles(['🌧️', '💧', '😭', '💔', '🥀', '☔', '🚶‍♂️']);
    }

    // Direct event listeners taaki mobile touch aur desktop click dono turant respond karein
    yesBtn.addEventListener('click', handleYesAction);
    noBtn.addEventListener('click', handleNoAction);
  </script>

</body>
</html>
