<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>RELATIONSHIP DECIDED</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      min-height: 100vh;
      width: 100vw;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0b0c10;
      color: #fff;
      overflow: hidden;
      position: relative;
      transition: background 0.8s cubic-bezier(0.16, 1, 0.3, 1);
      padding: 20px;
    }

    /* Screen shake for NO */
    @keyframes earthquake {
      0% { transform: translate(0, 0) rotate(0deg); }
      15% { transform: translate(-8px, 6px) rotate(-2deg); }
      30% { transform: translate(8px, -6px) rotate(2deg); }
      45% { transform: translate(-6px, -4px) rotate(-1deg); }
      60% { transform: translate(6px, 4px) rotate(1deg); }
      75% { transform: translate(-3px, 2px) rotate(0deg); }
      100% { transform: translate(0, 0) rotate(0deg); }
    }
    .shake-screen {
      animation: earthquake 0.6s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
    }

    /* Heavy Glassmorphic Card */
    .card {
      width: 100%;
      max-width: 420px;
      background: rgba(22, 27, 34, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 32px;
      padding: 42px 26px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      text-align: center;
      position: relative;
      z-index: 1000;
      transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .emoji-display {
      font-size: 85px;
      line-height: 1.1;
      height: 110px;
      display: flex;
      align-items: center;
      justify-content: center;
      filter: drop-shadow(0 12px 25px rgba(0,0,0,0.5));
      animation: breathe 3s ease-in-out infinite;
    }
    @keyframes breathe {
      0%, 100% { transform: scale(1) translateY(0); }
      50% { transform: scale(1.08) translateY(-6px); }
    }

    h2 {
      font-size: 23px;
      font-weight: 800;
      margin: 18px 0 32px 0;
      line-height: 1.5;
      letter-spacing: 0.5px;
      color: #f1f1f1;
      text-transform: uppercase;
      white-space: pre-line;
      text-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }

    /* Heavy Buttons */
    .btn-container {
      display: flex;
      gap: 16px;
      justify-content: center;
      position: relative;
      z-index: 2000;
    }

    .heavy-btn {
      flex: 1;
      padding: 18px 12px;
      font-size: 20px;
      font-weight: 900;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      touch-action: manipulation;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      outline: none;
    }
    .heavy-btn:active {
      transform: scale(0.92);
    }

    /* Heavy YES - Neon Romantic Flame */
    .btn-yes {
      background: linear-gradient(135deg, #ff0844 0%, #ff4e50 100%);
      color: #fff;
      box-shadow: 0 10px 30px rgba(255, 8, 68, 0.5), inset 0 2px 2px rgba(255, 255, 255, 0.4);
    }

    /* Heavy NO - Dark Concrete Charcoal */
    .btn-no {
      background: linear-gradient(135deg, #2c3440 0%, #1a1e24 100%);
      color: #9aa5b5;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
    }

    /* Particles Drop Effect */
    .fx-item {
      position: fixed;
      pointer-events: none;
      z-index: 500;
      animation: stormFall linear forwards;
    }
    @keyframes stormFall {
      0% {
        transform: translateY(-80px) rotate(0deg) scale(0.4);
        opacity: 0;
      }
      15% {
        opacity: 1;
        transform: translateY(5vh) rotate(45deg) scale(1.1);
      }
      90% {
        opacity: 1;
      }
      100% {
        transform: translateY(110vh) rotate(360deg) scale(1.3);
        opacity: 0;
      }
    }

    /* --- YES THEME --- */
    body.theme-love {
      background: radial-gradient(circle at center, #ff1361 0%, #fff800 100%);
      background-size: cover;
    }
    body.theme-love .card {
      background: rgba(255, 255, 255, 0.2);
      border: 2px solid rgba(255, 255, 255, 0.5);
      box-shadow: 0 30px 80px rgba(255, 19, 97, 0.6), inset 0 0 30px rgba(255, 255, 255, 0.4);
    }
    body.theme-love h2 {
      color: #ffffff;
      text-shadow: 0 0 20px rgba(255, 255, 255, 0.9), 0 0 40px #ff0844;
    }

    /* --- NO THEME --- */
    body.theme-sad {
      background: radial-gradient(circle at center, #14171c 0%, #000000 100%);
    }
    body.theme-sad .card {
      background: rgba(8, 10, 14, 0.92);
      border: 1px solid rgba(255, 0, 0, 0.2);
      box-shadow: 0 30px 90px rgba(0, 0, 0, 1), 0 0 40px rgba(255, 0, 0, 0.15);
    }
    body.theme-sad h2 {
      color: #e63946;
      text-shadow: 0 0 15px rgba(230, 57, 70, 0.5);
    }
  </style>
</head>
<body id="screenBody">

  <div class="card" id="cardBox">
    <div class="emoji-display" id="mainEmoji">💍🤔</div>
    <h2 id="mainHeading">RELATIONSHIP DECIDED OPTION H SOCH SMJH KR JAWAAB DIYO ?</h2>
    <div class="btn-container" id="actions">
      <button class="heavy-btn btn-yes" id="yesAction">YES</button>
      <button class="heavy-btn btn-no" id="noAction">NO</button>
    </div>
  </div>

  <script>
    const body = document.getElementById('screenBody');
    const card = document.getElementById('cardBox');
    const emoji = document.getElementById('mainEmoji');
    const heading = document.getElementById('mainHeading');
    const actions = document.getElementById('actions');
    const yesBtn = document.getElementById('yesAction');
    const noBtn = document.getElementById('noAction');

    let triggered = false;

    function triggerStorm(list, count) {
      for (let i = 0; i < count; i++) {
        setTimeout(() => {
          const item = document.createElement('div');
          item.className = 'fx-item';
          item.innerText = list[Math.floor(Math.random() * list.length)];
          item.style.left = Math.random() * 92 + 'vw';
          item.style.fontSize = Math.floor(Math.random() * 25 + 25) + 'px';
          
          const dur = Math.random() * 2 + 2.5;
          item.style.animationDuration = dur + 's';
          
          document.body.appendChild(item);
          setTimeout(() => item.remove(), (dur + 0.5) * 1000);
        }, i * 75);
      }
    }

    function onYesTap(e) {
      if (e) { e.preventDefault(); e.stopPropagation(); }
      if (triggered) return;
      triggered = true;

      body.className = 'theme-love';
      emoji.innerText = '👩‍❤️‍👨💖🔥';
      heading.innerText = 'Yayyy! Dil khush kar diya toone love u my love ❤️✨';
      
      actions.innerHTML = `
        <button class="heavy-btn btn-yes" onclick="window.location.reload()" style="background: rgba(255,255,255,0.3); border: 1px solid #fff; box-shadow: 0 0 30px #fff;">
          ❤️ FOREVER TOGETHER ❤️
        </button>
      `;

      triggerStorm(['❤️', '💖', '🔥', '🥰', '💍', '✨', '💋', '🎉', '🌹'], 55);
    }

    function onNoTap(e) {
      if (e) { e.preventDefault(); e.stopPropagation(); }
      if (triggered) return;
      triggered = true;

      body.className = 'theme-sad shake-screen';
      setTimeout(() => body.classList.remove('shake-screen'), 700);

      emoji.innerText = '💔🥀⛈️';
      heading.innerText = 'bye bye forever darling priya 😭\nSAB KHTM H IS BAAR AB 💔🥀';
      
      actions.innerHTML = `
        <button class="heavy-btn btn-no" onclick="window.location.reload()" style="background: #111; color: #777; border: 1px solid #333;">
          🛑 KHATAM 🛑
        </button>
      `;

      triggerStorm(['💔', '😭', '🥀', '🌧️', '💧', '⚡', '⚰️', '🖤', '📉'], 60);
    }

    // Direct multi-layer touch/click listeners - Fast touch execution
    ['pointerdown', 'touchstart', 'click'].forEach(evtType => {
      yesBtn.addEventListener(evtType, onYesTap, { passive: false });
      noBtn.addEventListener(evtType, onNoTap, { passive: false });
    });
  </script>

</body>
</html>
